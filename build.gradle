buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Если сборка не стартует, поставь сюда ту же версию, что в твоём рабочем проекте (MinimalIconPack)
        classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
